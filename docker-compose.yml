services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: sales
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sales:${POSTGRES_PASSWORD}@db:5432/sales
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
volumes:
  pgdata:
