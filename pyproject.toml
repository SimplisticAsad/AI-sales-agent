[project]
name = "ai-sales-agent"
version = "0.1.0"
description = "Autonomous AI sales agent: modular agentic pipeline with deterministic business policy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
postgres = ["psycopg[binary]>=3.1"]
chatterbox = ["chatterbox-tts", "torchaudio"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
